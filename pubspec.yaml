name: rigmusic
description: Rig Music - The Mystical Bard's Toolkit & Acoustic Sanctuary
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  http: ^1.2.0
  image_picker: ^1.0.7
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^7.0.1
  web: ^1.1.0
  # NOTE: the Android tuner mic is captured by the app's own Kotlin code
  # (android/.../MainActivity.kt → EventChannel "rigmusic/mic_stream");
  # the web build uses the Web Audio API. No plugin package needed.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
