org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental caches are written to <project>/build (D:) while plugin
# sources live in the pub cache (C:). On Windows the two drive roots make the
# incremental cache close fail with "this and base files have different
# roots", breaking every plugin's compileReleaseKotlin — so incremental
# compilation is turned off (a bit slower, but reliable).
kotlin.incremental=false
